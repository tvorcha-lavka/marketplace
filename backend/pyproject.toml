[project]
name = "tvorcha-lavka"
version = "0.1.0"
description = "Marketplace backend"
authors = [
    {name = "usik-sviatoslav",email = "usik.sviatoslav.dev@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "boto3 (>=1.38.36,<2.0.0)",
    "celery (>=5.5.3,<6.0.0)",
    "deep-translator (>=1.11.4,<2.0.0)",
    "django (>=5.2.3,<6.0.0)",
    "django-celery-beat (>=2.8.1,<3.0.0)",
    "django-cors-headers (>=4.7.0,<5.0.0)",
    "django-filter (>=25.1,<26.0)",
    "django-model-utils (>=5.0.0,<6.0.0)",
    "django-mptt (>=0.17.0,<0.18.0)",
    "django-parler (>=2.3,<3.0)",
    "django-parler-rest (>=2.2,<3.0)",
    "django-redis (>=5.4.0,<6.0.0)",
    "django-stubs-ext (>=5.2.0,<6.0.0)",
    "django-storages (>=1.14.6,<2.0.0)",
    "djangorestframework (>=3.16.0,<4.0.0)",
    "djangorestframework-simplejwt (>=5.5.0,<6.0.0)",
    "drf-social-oauth2 (>=3.1.0,<4.0.0)",
    "drf-spectacular (>=0.28.0,<0.29.0)",
    "gunicorn (>=23.0.0,<24.0.0)",
    "psycopg2-binary (>=2.9.10,<3.0.0)",
    "pillow (>=11.2.1,<12.0.0)",
    "pillow-heif (>=0.22.0,<0.23.0)",
    "pydantic (>=2.11.6,<3.0.0)",
    "pydantic-settings (>=2.9.1,<3.0.0)",
    "python-json-logger (>=3.3.0,<4.0.0)",
    "uuid6 (>=2025.0.0,<2026.0.0)",
    "uvicorn (>=0.34.3,<0.35.0)",
]


[tool.poetry.group.dev.dependencies]
pre-commit = "^4.2.0"
jinja2-cli = "^0.8.2"


[tool.poetry.group.lint.dependencies]
black = "^25.1.0"
isort = "^6.0.1"
flake8 = "^7.2.0"
flake8-bugbear = "^24.12.12"
flake8-pyproject = "^1.2.3"
flake8-functions = "^0.0.8"
flake8-variables-names = "^0.0.6"
flake8-class-attributes-order = "^0.3.0"


[tool.poetry.group.typecheck.dependencies]
mypy = "^1.16.0"
django-stubs = "^5.2.0"
django-filter-stubs = "^0.1.3"


[tool.poetry.group.debug.dependencies]
django-silk = "^5.4.0"


[tool.poetry.group.test.dependencies]
pytest = "^8.4.0"
pytest-django = "^4.11.1"
pytest-mock = "^3.14.1"
pytest-cov = "^6.2.1"


# --- ISORT CONFIG: https://pycqa.github.io/isort/docs/configuration/profiles --  ---  ---  ---  ---  ---  ---  ---  ---


[tool.isort]
profile = "black"
force_grid_wrap = 0
line_length = 120
multi_line_output = 3
include_trailing_comma = true
use_parentheses = true


# --- BLACK CONFIG: https://black.readthedocs.io/en/stable/usage_and_configuration/the_basics.html -  ---  ---  ---  ---


[tool.black]
line-length = 120


# --- FLAKE8 CONFIG: https://flake8.pycqa.org/en/latest/user/configuration.html   ---  ---  ---  ---  ---  ---  ---  ---


[tool.flake8]
exclude = [
    ".env",
    ".git",
    "venv",
    "poetry.lock",
    "__pycache__",
    ".mypy_cache",
    ".pytest_cache",
    "src/core/settings/*.py",
]
ignore = []
max-complexity = 8
max-line-length = 120
max-returns-amount = 4


# --- MYPY CONFIG: https://mypy.readthedocs.io/en/stable/config_file.html -  ---  ---  ---  ---  ---  ---  ---  ---  ---


[tool.mypy]
python_version = "3.11"
mypy_path = ["src"]
plugins = [
    "pydantic.mypy",
    "mypy_django_plugin.main",
    "mypy_drf_plugin.main",
]
exclude = [
    "migrations",
]

ignore_errors = false
ignore_missing_imports = false
pretty = true
strict = true
show_absolute_path = true
show_column_numbers = true
show_error_context = true
show_traceback = true
warn_unreachable = true
warn_no_return = true


[[tool.mypy.overrides]]
ignore_missing_imports = true
module = [
    "celery.*",
    "deep_translator.*",
    "django_redis.*",
    "mptt.*",
    "parler.*",
    "social_django.*",
]


[tool.django-stubs]
django_settings_module = "core.settings.development"
strict_settings = false


# --- PYTEST CONFIG: https://docs.pytest.org/en/latest/reference/customize.html   ---  ---  ---  ---  ---  ---  ---  ---


[tool.pytest.ini_options]
addopts = [
    "--exitfirst",
    "--color=yes",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--cov-fail-under=85",
    "--failed-first",
    "--new-first",
    "--pythonwarnings=error",
]
markers = ["unit", "smoke"]
python_files = ["tests.py", "test_*.py", "*_test.py"]
DJANGO_SETTINGS_MODULE = "core.settings.testing"


# --- COVERAGE CONFIG: https://coverage.readthedocs.io/en/latest/config.html ---  ---  ---  ---  ---  ---  ---  ---  ---


[tool.coverage.run]
source = ["/src"]
data_file = "/tmp/htmlcov/.coverage"
omit = ["manage.py", "core/settings/*"]
branch = true


[tool.coverage.html]
directory = "/tmp/htmlcov"


# --- SYSTEM --  ---  ---  ---  ---  ---  ---  ---  ---  ---  ---  ---  ---  ---  ---  ---  ---  ---  ---  ---  ---  ---


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
