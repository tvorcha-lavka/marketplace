repos:
  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: make -C backend isort
        language: system
        types: [ python ]
        pass_filenames: false

      - id: black
        name: black
        entry: make -C backend black
        language: system
        types: [ python ]
        pass_filenames: false

      - id: flake8
        name: flake8
        entry: make -C backend flake8
        language: system
        types: [ python ]
        pass_filenames: false

      - id: mypy
        name: mypy
        entry: make -C backend mypy
        language: system
        types: [ python ]
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: make -C backend pytest down
        language: system
        types: [ python ]
        pass_filenames: false
