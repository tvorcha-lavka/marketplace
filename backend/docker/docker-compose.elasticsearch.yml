services:
  elasticsearch:
    image: elasticsearch:9.0.2
    container_name: elasticsearch
    env_file: ../../.env
    restart: always
    environment:
      xpack.security.enabled: true
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    ports:
      - "9200:9200"
    healthcheck:
      test: [ "CMD", "curl", "-u", "${ELASTIC_USERNAME}:${ELASTIC_PASSWORD}", "-f", "http://localhost:9200/_cluster/health" ]
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - tvorcha-network
    volumes:
      - elasticsearch-data:/usr/share/elasticsearch/data
    mem_limit: 1024m
    cpus: 1

networks:
  tvorcha-network:
    external: true

volumes:
  elasticsearch-data:
